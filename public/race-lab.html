<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Race course lab · Groddle</title>
  <!-- Content keys for data and art URLs (js/data-urls.js): before every other script. -->
  <script src="js/data-versions.js?v=b3ff6ff3"></script>
  <script src="js/data-urls.js?v=g420-1"></script>
  <script src="vendor/pixi/pixi-8.22.0.min.js"></script>
  <style>
    body { margin: 0; padding: 16px; font-family: "Trebuchet MS", system-ui, sans-serif; background: #1a1a22; color: #f0ebe3; }
    h1 { margin: 0 0 4px; font-size: 1.3rem; color: #95a3d6; }
    p { margin: 0 0 10px; color: #b9b4ab; font-size: .85rem; max-width: 70rem; }
    nav a { color: #95a3d6; margin-right: 10px; font-size: .9rem; }
    #stage canvas { display: block; max-width: 100%; border-radius: 8px; }
  </style>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
</head>
<body>
  <h1 id="title">Race course lab</h1>
  <p id="meta"></p>
  <nav id="nav"></nav>
  <div id="stage"></div>
  <script type="module">
    import { raceCourse, RACE_COURSE_IDS } from './js/race-courses.js';
    import { renderRaceCourse, drawFinishPosts, drawCheckpointFlag } from './js/race-render.js';
    import { RACES, routeDurationMs, formatRaceTime } from './js/races.js';
    import * as textureUrls from './js/textures.js';
    import { installHiresDecos } from './js/deco-hires.js?v=g431-1';

    // Decos ship as WebP; route the .png deco URLs the renderer asks for, as the game does.
    installHiresDecos(textureUrls);

    // ?race=<id> overview, or &x=&y=&zoom=1 for a 960x540 window at full size.
    const params = new URLSearchParams(location.search);
    const id = params.get('race') || 'space_race';
    const nav = document.getElementById('nav');
    nav.innerHTML = RACE_COURSE_IDS.map((r) => `<a href="?race=${r}">${RACES[r].title}</a>`).join('');
    const course = raceCourse(id);
    const zoom = Number(params.get('zoom')) || 0;
    const W = zoom ? 960 : 1600;
    const H = zoom ? 540 : 900;
    const scale = zoom || Math.min(W / course.width, H / course.height);
    const app = new PIXI.Application();
    await app.init({ width: W, height: H, background: 0x222222, antialias: true, preference: 'webgl' });
    document.getElementById('stage').appendChild(app.canvas);
    const world = new PIXI.Container();
    world.scale.set(scale);
    const camX = zoom ? Number(params.get('x')) || 0 : 0;
    const camY = zoom ? Number(params.get('y')) || 0 : 0;
    world.x = -camX * scale;
    world.y = -camY * scale;
    app.stage.addChild(world);
    const bg = renderRaceCourse(PIXI, course);
    bg.updateParallax?.(camX, camY);
    world.addChild(bg);
    for (const cp of course.checkpoints) world.addChild(drawCheckpointFlag(PIXI, cp));
    if (course.finish) world.addChild(drawFinishPosts(PIXI, course.finish));
    const lines = new PIXI.Graphics();
    const route = (nodes, color) => {
      nodes.forEach((n, i) => (i ? lines.lineTo(n.x, n.y - 4) : lines.moveTo(n.x, n.y - 4)));
      lines.stroke({ width: zoom ? 2 : 6, color, alpha: 0.9 });
      for (const n of nodes) if (n.mode === 'jump') lines.circle(n.x, n.y - 4, zoom ? 3 : 9).fill(color);
    };
    if (params.get('route') !== '0') {
      route(course.route, 0xffd55b);
      if (course.rivalRoute) route(course.rivalRoute, 0xc9a6ff);
    }
    const spawn = new PIXI.Graphics();
    spawn.rect(course.spawn.player.x - 14, course.spawn.player.y - 90, 28, 90).fill(0xffd55b);
    spawn.rect(course.spawn.rival.x - 14, course.spawn.rival.y - 90, 28, 90).fill(0xc9a6ff);
    // Grab 'Em Good quoins: gold = your side, lilac = the rival's, white = shared.
    const coins = new PIXI.Graphics();
    for (const q of course.quoins || []) {
      coins.circle(q.x, q.y, zoom ? 12 : 16).fill({ color: q.owner === 'rival' ? 0xc9a6ff : q.owner === 'shared' ? 0xffffff : 0xb5e35b, alpha: 0.95 });
    }
    world.addChild(lines, spawn, coins);
    const ownRoute = course.kind === 'quoins' ? course.rivalRoute.slice(0, course.route.length) : course.rivalRoute || course.route;
    const rival = routeDurationMs(ownRoute, { pace: course.rivalPace, gravity: course.gravity });
    const best = routeDurationMs(course.route, { pace: 1, gravity: course.gravity });
    document.getElementById('title').textContent = `${RACES[id].title} · ${course.width}×${course.height}`;
    document.getElementById('meta').textContent =
      `${course.source} Gravity ${course.gravity} · ${course.platforms.length} ledges · ${course.walls.length} climbs · ${course.checkpoints.length} checkpoints${course.quoins?.length ? ` · ${course.quoins.length} quoins` : ''} · rival ${formatRaceTime(rival)}${course.kind === 'quoins' ? ' to the canopy' : ''} · clean run ${formatRaceTime(best)}. Yellow: your route; lilac: the rival's.`;
    document.body.dataset.ready = '1';
  </script>
</body>
</html>
