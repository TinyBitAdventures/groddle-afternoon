<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- iMG quoin, redrawn as vectors from Tiny Speck's quoin_img_thumb (CC0): scalloped purple badge, white rim, "i", propeller. -->
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="-23" x2="0" y2="23">
      <stop offset="0" stop-color="#8b699c"/>
      <stop offset="0.45" stop-color="#7c5491"/>
      <stop offset="1" stop-color="#8a60a1"/>
    </linearGradient>
    <g id="badge">
      <circle cx="0" cy="0" r="18.6"/>
      <circle cx="0.00" cy="-16.20" r="6.4"/>
      <circle cx="11.46" cy="-11.46" r="6.4"/>
      <circle cx="16.20" cy="-0.00" r="6.4"/>
      <circle cx="11.46" cy="11.46" r="6.4"/>
      <circle cx="0.00" cy="16.20" r="6.4"/>
      <circle cx="-11.46" cy="11.46" r="6.4"/>
      <circle cx="-16.20" cy="0.00" r="6.4"/>
      <circle cx="-11.46" cy="-11.46" r="6.4"/>
    </g>
  </defs>
  <!-- propeller -->
  <rect x="30.7" y="6" width="2.6" height="9" rx="1.1" fill="#e3ad31"/>
  <ellipse cx="32" cy="6.2" rx="11" ry="2.2" fill="#a0a0a0" fill-opacity="0.7"/>
  <circle cx="32" cy="6.2" r="2" fill="#e7d37d"/>
  <!-- white rim, then the purple body -->
  <g transform="translate(32 39.5)">
    <g transform="scale(1.1)" fill="#ffffff"><use href="#badge"/></g>
    <g fill="url(#body)"><use href="#badge"/></g>
  </g>
  <!-- the i -->
  <circle cx="32" cy="28" r="3.5" fill="#f5e5f5"/>
  <rect x="29.3" y="33.4" width="5.4" height="16" rx="2.7" fill="#f5e5f5"/>
</svg>
