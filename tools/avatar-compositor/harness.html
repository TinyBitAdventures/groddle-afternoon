<!doctype html>
<html>
<head><meta charset="utf-8"><title>Avatar compositor harness</title></head>
<body>
<script type="module">
  // Offline driver for tools/avatar-compositor/build.mjs (render, score).
  import { loadCatalog, prepareLook, prepareIdle, sheetLayout, paintSheet, sheetDef, paintPreview, bakeIdleSheet, SHEET_ORDER, IDLE_SHEET_ORDER } from '/js/avatar-compositor.js';
  import { resolveLook } from '/js/avatar-looks.js';

  /** { sheet: { def, 1: dataUrl, 3: dataUrl } } */
  window.renderLook = async (look, scales = [1, 3], only = null) => {
    const prep = await prepareLook(look, '/assets/avatar/');
    await prepareIdle(prep);
    const out = {};
    for (const name of [...SHEET_ORDER, ...IDLE_SHEET_ORDER]) {
      if (only && !only.includes(name)) continue;
      const layout = sheetLayout(prep, name);
      out[name] = { def: sheetDef(layout, `${name}.png`) };
      for (const s of scales) out[name][s] = paintSheet(prep, layout, s).toDataURL('image/png');
    }
    return out;
  };

  /** One frame preview as a data URL. */
  window.renderPreview = async (look, frame = 801, w = 240, h = 320) => {
    const prep = await prepareLook(look, '/assets/avatar/');
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    paintPreview(prep, c, frame);
    return c.toDataURL('image/png');
  };

  window.resolveLook = async (fields) => resolveLook(fields, await loadCatalog('/assets/avatar/'));

  /** Time a full 3x bake of a look (ms). */
  window.timeBake = async (look, scale = 3) => {
    const prep = await prepareLook(look, '/assets/avatar/');
    const t = performance.now();
    for (const name of SHEET_ORDER) paintSheet(prep, sheetLayout(prep, name), scale);
    return performance.now() - t;
  };
  /** Time the lazy idle bakes of a look: each sheet painted in slices (ms per slice). */
  window.timeIdleBake = async (look, scale = 3, budgetMs = 4) => {
    const prep = await prepareLook(look, '/assets/avatar/');
    let t = performance.now();
    await prepareIdle(prep);
    const out = { prepareIdleMs: performance.now() - t, sheets: {} };
    for (const name of IDLE_SHEET_ORDER) {
      t = performance.now();
      const r = await bakeIdleSheet(prep, name, scale, { budgetMs });
      out.sheets[name] = { wallMs: performance.now() - t, ...r.stats, cells: r.def.cells, px: [r.canvas.width, r.canvas.height] };
    }
    return out;
  };
  window.harnessReady = true;
</script>
</body>
</html>
