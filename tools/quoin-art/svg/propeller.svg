<svg xmlns="http://www.w3.org/2000/svg" width="30" height="16" viewBox="-15 -4 30 16">
  <!--
    Quoin propeller, hand-traced from Tiny Speck's 1x quoin sheet (CC0).
    Origin = rotor hub. Three groups the build transforms per frame:
      #stem   stays upright; mirrored (scale(-1 1)) when the rotor is flipped
      #rotor  the two-blade bar, scale(a 1) with a in -1..1 (its spin)
      #hub    the coloured cap, mirrored with the rotor
    The four stop colours with ids (hub-top, hub-bottom, stem-dark,
    stem-light) are swapped per quoin type by tools/quoin-art/build.mjs.
  -->
  <defs>
    <linearGradient id="blade" gradientUnits="userSpaceOnUse" x1="-12.65" y1="0" x2="12.65" y2="0">
      <stop offset="0" stop-color="#949494"/>
      <stop offset="0.5" stop-color="#d0d0d0"/>
      <stop offset="1" stop-color="#fbfbfb"/>
    </linearGradient>
    <linearGradient id="hub-fill" x1="0" y1="0" x2="0" y2="1">
      <stop id="hub-top" offset="0" stop-color="#6aaef4"/>
      <stop id="hub-bottom" offset="1" stop-color="#269be3"/>
    </linearGradient>
    <linearGradient id="stem-fill" x1="0" y1="0" x2="1" y2="0">
      <stop id="stem-dark" offset="0" stop-color="#249be3"/>
      <stop id="stem-light" offset="1" stop-color="#79aef4"/>
    </linearGradient>
  </defs>
  <g id="stem">
    <rect x="-0.95" y="1.2" width="1.9" height="8" fill="url(#stem-fill)"/>
  </g>
  <g id="rotor">
    <rect x="-12.65" y="-1.625" width="10.8" height="3.65" rx="1.825" fill="url(#blade)"/>
    <rect x="1.85" y="-1.625" width="10.8" height="3.65" rx="1.825" fill="url(#blade)"/>
  </g>
  <g id="hub">
    <ellipse cx="0" cy="0.4" rx="2.1" ry="1.5" fill="url(#hub-fill)"/>
  </g>
</svg>
