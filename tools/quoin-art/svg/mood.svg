<svg xmlns="http://www.w3.org/2000/svg" width="40" height="45" viewBox="0 0 40 45">
  <!--
    mood quoin: green smiley, soft white rim.
    Hand-traced from Tiny Speck's 1x quoin sheet (CC0): outlines follow the
    1x alpha and colour edges, colours are sampled from its pixels. Drawn in
    40 x 45 cell units where the body sits in frame 0 of its sheet row;
    tools/quoin-art/build.mjs moves it per frame (frames.json).
  -->
  <defs>
    <circle id="face" cx="19" cy="28.05" r="10.05"/>
    <mask id="top" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="45"><use href="#face" fill="#fff"/><use href="#face" fill="#000" transform="translate(0 1.3)"/></mask>
    <mask id="bot" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="45"><use href="#face" fill="#fff"/><use href="#face" fill="#000" transform="translate(0 -1.6)"/></mask>
  </defs>
  <radialGradient id="rim" gradientUnits="userSpaceOnUse" cx="19" cy="28.05" r="12.2"><stop offset="0.8934" stop-color="#fcfcfc" stop-opacity="0.86"/><stop offset="1" stop-color="#fcfcfc" stop-opacity="0"/></radialGradient><circle cx="19" cy="28.05" r="12.2" fill="url(#rim)"/>
  <use href="#face" fill="#97c100"/>
  <rect width="40" height="45" fill="#acd900" mask="url(#top)"/>
  <rect width="40" height="45" fill="#6c8a00" mask="url(#bot)"/>
  <g fill="#556e00">
    <ellipse cx="15.5" cy="24.95" rx="1.25" ry="1.7"/>
    <ellipse cx="22.5" cy="24.95" rx="1.25" ry="1.7"/>
    <path d="M12.8 29.1H25.2C25 32 22.2 33.55 19 33.55C15.8 33.55 13 32 12.8 29.1Z"/>
  </g>
  <path d="M13.6 28.9H24.4C24.1 31 21.7 31.9 19 31.9C16.3 31.9 13.9 31 13.6 28.9Z" fill="#fff"/>
</svg>
